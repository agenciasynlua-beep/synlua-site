[build]
  command = "npm run build"
  publish = "dist"

# SPA: qualquer rota (ex.: /onboarding) volta para o index.html em vez de dar 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache: arquivos com hash no nome nunca mudam; o resto tem cache longo mas revalida em silêncio
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
