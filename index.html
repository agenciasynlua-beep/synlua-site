    <style>
      html,body{background:#050508;margin:0}
      #splash{position:fixed;inset:0;z-index:2147483647;background:#050508;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
      #splash.out{opacity:0;visibility:hidden;pointer-events:none}
      #splash .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
      #splash img{display:block;width:min(64vw,360px);height:auto;animation:sp-reveal 1.1s cubic-bezier(.22,1,.36,1) both}
      #splash .bar{display:block;width:min(40vw,200px);height:1px;background:linear-gradient(90deg,transparent,#8B5CF6,#6366F1,transparent);transform-origin:center;animation:sp-bar 1.1s cubic-bezier(.22,1,.36,1) .15s both}
      #splash .glow{position:absolute;left:50%;top:50%;width:520px;height:520px;max-width:120vw;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(139,92,246,.22),transparent 65%);animation:sp-glow 1.4s ease-out both;pointer-events:none}
      @keyframes sp-reveal{from{clip-path:inset(0 100% 0 0);opacity:.3;filter:blur(10px);transform:scale(.97)}to{clip-path:inset(0 0 0 0);opacity:1;filter:blur(0);transform:none}}
      @keyframes sp-bar{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
      @keyframes sp-glow{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#splash img,#splash .bar,#splash .glow{animation:none}#splash{transition-duration:.2s}}
    </style>
    <script>
      // Splash: sai quando (app pintou) + (CSS carregou) + (tempo mínimo do reveal). Teto de 5s.
      (function () {
        var t0 = Date.now(), done = false, app = false, css = false;
        var min = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 250 : 1150;
        function hide() {
          if (done) return;
          done = true;
          var s = document.getElementById("splash");
          if (!s) return;
          s.className = "out";
          setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 800);
        }
        function check() {
          if (!app || !css) return;
          var wait = min - (Date.now() - t0);
          if (wait > 0) setTimeout(hide, wait); else hide();
        }
        window.__splashReady = function () { app = true; check(); };
        window.__cssOk = function () { css = true; check(); };
        setTimeout(hide, 5000);
      })();
    </script>
